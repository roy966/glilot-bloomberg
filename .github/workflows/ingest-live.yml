name: ingest-live

# Off-Vercel worker. Do not put TWITTERAPI_IO_KEY on Vercel.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ingest
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TWITTER_DAILY_READ_BUDGET: ${{ vars.TWITTER_DAILY_READ_BUDGET }}
        run: node scripts/ingest-live.mjs
      - name: Commit live feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/live.json ]; then git add data/live.json; fi
          if [ -f data/ingest-state.json ]; then git add data/ingest-state.json; fi
          if git diff --staged --quiet; then
            echo "no live feed changes"
            exit 0
          fi
          git commit -m "Update live.json from off-Vercel ingest"
          git push
